name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 (2026-07-16)
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip

      - name: Build CLI binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          ldflags="-s -w -X github.com/NotNull92/hera-agent-godot/cmd.version=${VERSION}"
          # Asset names are version-less so installers can fetch them from
          # /releases/latest/download/<asset>. The binary still reports VERSION.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="hera"
            [ "$os" = "windows" ] && bin="hera.exe"
            echo "── building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "build/$bin" .
            if [ "$os" = "windows" ]; then
              (cd build && zip -q "../dist/hera-${os}-${arch}.zip" "$bin")
            else
              tar -C build -czf "dist/hera-${os}-${arch}.tar.gz" "$bin"
            fi
            rm -f "build/$bin"
          done

      - name: Package Godot addon
        run: |
          set -euo pipefail
          zip -qr "dist/hera-agent-godot-addon.zip" addons/hera_agent_godot
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("dist/hera-agent-godot-addon.zip")
          names = set(ZipFile(archive).namelist())
          required = {
              "addons/hera_agent_godot/LICENSE",
              "addons/hera_agent_godot/plugin.cfg",
              "addons/hera_agent_godot/hera_agent_plugin.gd",
              "addons/hera_agent_godot/assets/hera-pointing.png",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"addon archive missing entries: {missing}")
          if "LICENSE" in names:
              raise SystemExit("addon archive must not include duplicate root LICENSE")
          if any(name.startswith(".claude/") or name == ".claude" for name in names):
              raise SystemExit("addon archive must not include .claude")
          PY

      - name: Publish compiler helper
        run: |
          set -euo pipefail
          dotnet publish csharp-host/Hera.CSharpHost.csproj -c Release -f net8.0 --self-contained false -p:UseAppHost=false -o dist/csharp-host
          (cd dist/csharp-host && zip -qr ../hera-csharp-host.zip .)
          rm -rf dist/csharp-host

      - name: Checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
